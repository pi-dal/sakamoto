name: Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/mobile-go.py'
      - 'scripts/go-size-profile.json'
      - 'scripts/test-mobile-go.py'
      - 'android/**'
      - 'pkg/**'
      - 'internal/**'
      - 'tools/**'
      - 'go.mod'
      - 'go.sum'
      - 'mise*.toml'
      - '.github/workflows/android.yml'
  pull_request:
    paths:
      - 'scripts/mobile-go.py'
      - 'scripts/go-size-profile.json'
      - 'scripts/test-mobile-go.py'
      - 'android/**'
      - 'pkg/**'
      - 'internal/**'
      - 'tools/**'
      - 'go.mod'
      - 'go.sum'
      - 'mise*.toml'
      - '.github/workflows/android.yml'

permissions:
  contents: read

concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  debug-apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      MISE_ENV: android
    steps:
      - uses: actions/checkout@v5

      # Shared project config owns Go, Python, JDK, SDK and gomobile versions.
      - name: Set up mise toolchain
        uses: jdx/mise-action@v3
        with:
          version: '2026.10.0'
          cache: true
          cache_save: ${{ github.event_name != 'pull_request' }}

      - name: Cache Go modules and compilation
        uses: actions/cache@v4
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: android-go-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('mise*.toml', 'go.sum') }}
          restore-keys: |
            android-go-${{ runner.os }}-${{ runner.arch }}-

      - name: Prepare mobile tool paths and SDK packages
        run: |
          mise run mobile:tools
          mise run android:sdk

      - name: Set up Gradle caching
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      # No prefix fallback for native output: toolchain changes invalidate it.
      - name: Cache upstream libbox AAR
        id: libbox
        uses: actions/cache@v4
        with:
          path: android/app/libs/libbox.aar
          key: android-libbox-v4-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('mise*.toml', 'go.mod', 'go.sum', 'pkg/**', 'internal/**', 'android/scripts/build-libbox.sh', 'scripts/mobile-go.py', 'scripts/go-size-profile.json') }}

      - name: Build upstream libbox
        if: steps.libbox.outputs.cache-hit != 'true'
        run: mise run android:libbox

      - name: Run unit tests and build debug APK
        run: mise run android:verify

      - name: Verify signing and write checksum
        run: mise run android:checksum

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: sakamoto-debug-${{ github.sha }}
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/outputs/apk/debug/app-debug.apk.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

      - name: Upload unit test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-test-reports-${{ github.sha }}
          path: |
            android/app/build/reports/tests/
            android/app/build/test-results/
          if-no-files-found: warn
          retention-days: 14
