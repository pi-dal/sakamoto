name: Android release

on:
  push:
    tags: ['android-v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      MISE_ENV: android
    steps:
      - uses: actions/checkout@v5
      - uses: jdx/mise-action@v3
        with:
          version: '2026.10.0'
          cache: true
      - uses: actions/cache@v4
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: android-release-go-${{ runner.os }}-${{ hashFiles('mise*.toml', 'go.sum') }}
      - uses: gradle/actions/setup-gradle@v4
      - name: Prepare native toolchain
        run: |
          mise run mobile:tools
          mise run android:sdk
          mise run android:libbox
      - name: Restore release signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          umask 077
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/sakamoto-release.jks"
          test -s "$RUNNER_TEMP/sakamoto-release.jks"
      - name: Test and build official APK
        env:
          SAKAMOTO_ANDROID_KEYSTORE: ${{ runner.temp }}/sakamoto-release.jks
          SAKAMOTO_ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          SAKAMOTO_ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          SAKAMOTO_ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: mise exec -- python3 android/scripts/release.py
      - name: Verify tag matches APK version
        if: startsWith(github.ref, 'refs/tags/android-v')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python3 - <<'PY'
          import json, os, pathlib
          metadata = json.loads(pathlib.Path('dist/android/release-metadata.json').read_text())
          assert os.environ['RELEASE_TAG'] == 'android-v' + metadata['versionName']
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: sakamoto-android-release
          path: dist/android/
          if-no-files-found: error
          compression-level: 0
      - name: Upload GitHub release assets
        if: startsWith(github.ref, 'refs/tags/android-v')
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release upload "$RELEASE_TAG" dist/android/*.apk dist/android/SHA256SUMS dist/android/release-metadata.json --clobber
      - name: Remove temporary signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/sakamoto-release.jks"
