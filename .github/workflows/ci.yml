name: Go checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
      - uses: jdx/mise-action@v3
        with:
          version: '2026.10.0'
          cache: true
          cache_save: ${{ github.event_name != 'pull_request' }}
      - name: Validate workflows and scripts
        run: mise run ci:check
      - name: Check and build shared Go code
        run: mise run go:check
      - name: Package optimized macOS CLI/TUI
        run: mise run cli:build
      - uses: actions/upload-artifact@v4
        with:
          name: sakamoto-cli-${{ github.sha }}
          path: dist/cli/
          if-no-files-found: error
          retention-days: 14
