name: iOS integration

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'ios/**'
      - 'pkg/**'
      - 'internal/**'
      - 'cmd/**'
      - 'tools/**'
      - 'go.mod'
      - 'go.sum'
      - 'mise*.toml'
      - '.github/workflows/ios.yml'
  pull_request:
    paths:
      - 'ios/**'
      - 'pkg/**'
      - 'internal/**'
      - 'cmd/**'
      - 'tools/**'
      - 'go.mod'
      - 'go.sum'
      - 'mise*.toml'
      - '.github/workflows/ios.yml'

permissions:
  contents: read

concurrency:
  group: ios-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    # Apple supplies Xcode; all other project tools come from mise.
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5

      - name: Inspect Apple toolchain
        id: xcode
        run: |
          xcode-select -p
          xcodebuild -version
          swift --version
          echo "build=$(xcodebuild -version | tail -1 | tr ' ' '-')" >> "$GITHUB_OUTPUT"

      - name: Set up mise toolchain
        uses: jdx/mise-action@v3
        with:
          version: '2026.10.0'
          cache: true
          cache_save: ${{ github.event_name != 'pull_request' }}

      - name: Cache Go modules and compilation
        uses: actions/cache@v4
        with:
          path: |
            ~/go/pkg/mod
            ~/Library/Caches/go-build
          key: ios-go-${{ runner.os }}-${{ runner.arch }}-${{ steps.xcode.outputs.build }}-${{ hashFiles('mise.toml', 'go.sum') }}
          restore-keys: |
            ios-go-${{ runner.os }}-${{ runner.arch }}-${{ steps.xcode.outputs.build }}-

      - name: Prepare mobile tool paths
        run: mise run mobile:tools

      - name: Cache native iOS frameworks
        id: frameworks
        uses: actions/cache@v4
        with:
          path: ios/Frameworks
          key: ios-frameworks-v4-combined-${{ runner.os }}-${{ runner.arch }}-${{ steps.xcode.outputs.build }}-${{ hashFiles('mise.toml', 'go.mod', 'go.sum', 'pkg/**', 'internal/**', 'ios/scripts/build-*.sh', 'ios/scripts/flatten-gomobile-framework.sh') }}

      - name: Build combined Libbox and Mobilecore framework
        if: steps.frameworks.outputs.cache-hit != 'true'
        run: mise run ios:libbox

      - name: Verify Go, Swift and unsigned simulator app
        run: mise run ios:verify

      - name: Package simulator app
        run: mise run ios:package

      - name: Upload simulator app
        uses: actions/upload-artifact@v4
        with:
          name: sakamoto-ios-simulator-${{ github.sha }}
          path: |
            ios/build/Sakamoto-simulator.zip
            ios/build/Sakamoto-simulator.zip.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

      - name: Upload generated Xcode project
        uses: actions/upload-artifact@v4
        with:
          name: sakamoto-ios-xcode-project-${{ github.sha }}
          path: ios/Sakamoto.xcodeproj
          if-no-files-found: error
          retention-days: 14
