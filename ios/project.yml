# sakamoto iOS app + PacketTunnel extension.
#
# Generated Xcode project: `xcodegen generate` from this file (the .xcodeproj
# itself is git-ignored — the source of truth is here).
#
# PLACEHOLDER SIGNING VALUES (see ios/README.md before device use):
#   - DEVELOPMENT_TEAM is empty by default; set it here or in an exported
#     xcconfig when building for a real device.
#   - The app group "group.com.pidal.sakamoto" and bundle IDs
#     com.pidal.sakamoto{,.PacketTunnel} are development placeholders.
#   - Entitlements are real declarations (packet-tunnel-provider +
#     application-groups); Apple only grants the NetworkExtension
#     entitlement to a provisioned Team — a stub cannot emulate it.
name: Sakamoto
options:
  bundleIdPrefix: com.pidal
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
  groupSortPosition: top

packages:
  SakamotoiOS:
    path: .

settings:
  base:
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    CURRENT_PROJECT_VERSION: 15
    MARKETING_VERSION: 0.1.6
    SWIFT_VERSION: "5.10"

targets:
  Sakamoto:
    type: application
    platform: iOS
    sources:
      - path: App/Sources
      # Shared extension logic is also compiled into the app for integration
      # tests; it only starts when the PacketTunnel provider calls it.
      - path: Extension/ProviderExperimentRunner.swift
      - path: Shared
      - path: App/Assets.xcassets
    dependencies:
      - package: SakamotoiOS
        product: SakamotoKit
      - package: SakamotoiOS
        product: SakamotoNE
      - target: SakamotoPacketTunnel
        embed: true
        codeSign: true
      - target: SakamotoWidgets
        embed: true
        codeSign: true
      # App and VPN extension load one combined dynamic Go core. The app owns
      # the embedded framework; the extension resolves ../../Frameworks.
      - framework: Frameworks/Libbox.xcframework
        embed: true
        codeSign: true
      - sdk: libresolv.tbd
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.pidal.sakamoto
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_ENTITLEMENTS: App/Sakamoto.entitlements
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        TARGETED_DEVICE_FAMILY: "1,2"
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: sakamoto
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSCameraUsageDescription: Scan QR codes to import nodes, subscriptions or configurations.
        CFBundleURLTypes:
          - CFBundleURLName: com.pidal.sakamoto
            CFBundleURLSchemes: [sakamoto]
        SakamotoAppGroupIdentifier: group.com.pidal.sakamoto
        SakamotoProviderBundleIdentifier: com.pidal.sakamoto.PacketTunnel
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # iCloud Drive visibility for the sync container (matches
        # App/Sakamoto.entitlements + UbiquityICloudContainer — replace the
        # placeholder id in all three places together).
        NSUbiquitousContainers:
          iCloud.com.pidal.sakamoto:
            NSUbiquitousContainerIsDocumentScopePublic: true
            NSUbiquitousContainerName: sakamoto
            NSUbiquitousContainerSupportedFolderLevels: Any

  SakamotoPacketTunnel:
    type: app-extension
    platform: iOS
    sources:
      - path: Extension
    dependencies:
      - framework: Frameworks/Libbox.xcframework
        embed: false
      - package: SakamotoiOS
        product: SakamotoKit
      - sdk: libresolv.tbd
      # libbox's Go runtime references UIKit (background-task bookkeeping);
      # static archives carry no auto-link hints, so link it explicitly.
      - sdk: UIKit.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.pidal.sakamoto.PacketTunnel
        CODE_SIGN_ENTITLEMENTS: Extension/SakamotoPacketTunnel.entitlements
        APPLICATION_EXTENSION_API_ONLY: YES
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks @executable_path/../../Frameworks"
    info:
      path: Extension/Info.plist
      properties:
        CFBundleDisplayName: sakamoto Tunnel
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.networkextension.packet-tunnel
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).SakamotoPacketTunnelProvider
        SakamotoAppGroupIdentifier: group.com.pidal.sakamoto

  SakamotoWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: Widgets
      - path: Shared
    dependencies:
      - package: SakamotoiOS
        product: SakamotoKit
      - package: SakamotoiOS
        product: SakamotoNE
      - sdk: WidgetKit.framework
      - sdk: AppIntents.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.pidal.sakamoto.WidgetExtension
        CODE_SIGN_ENTITLEMENTS: Widgets/SakamotoWidgets.entitlements
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
        TARGETED_DEVICE_FAMILY: "1,2"
    info:
      path: Widgets/Info.plist
      properties:
        CFBundleDisplayName: sakamoto Widgets
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension

  SakamotoAppTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: AppTests
    dependencies:
      - target: Sakamoto
      - package: SakamotoiOS
        product: SakamotoKit
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.pidal.sakamoto.AppTests

schemes:
  Sakamoto:
    build:
      targets:
        Sakamoto: all
        SakamotoPacketTunnel: all
        SakamotoWidgets: all
    run:
      config: Debug
    test:
      targets:
        - SakamotoAppTests
